services:
  postgres:
    image: postgres:16
    container_name: medical-ingestion-postgres
    environment:
      POSTGRES_DB: medical_ingestion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_storage:
    driver: local
